[project]
name = "llm-apig"
version = "0.1.7"
description = "Personal LLM API gateway with failover"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyinstaller>=6",
    "Pillow>=10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
