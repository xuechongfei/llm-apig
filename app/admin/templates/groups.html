{% extends "base.html" %}
{% block nav_groups %}class="on"{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h2>模型组</h2>
    <p>统一模型名 → 多渠道映射与优先级</p>
  </div>
</div>

<div class="card form-card">
<form method="post" action="/admin/groups" style="display:flex;gap:10px;max-width:520px">
  <input name="name" required placeholder="统一模型名，如 my-claude" style="flex:1">
  <button class="btn btn-primary" type="submit">新建</button>
</form>
</div>

<div class="card">
<table>
<thead><tr><th>名称 <span class="hint" style="font-weight:400">客户端填写的模型名</span></th><th>渠道数</th><th>操作</th></tr></thead>
<tbody>
{% for g in groups %}
<tr>
<td><b><a href="/admin/groups/{{ g["id"] }}" style="text-decoration:none">{{ g["name"] }}</a></b></td>
<td>{{ g["n"] }}</td>
<td>
<form class="inline" method="post" action="/admin/groups/{{ g["id"] }}/delete"
 onsubmit="return confirm('确认删除该模型组？')">
  <button class="btn btn-sm btn-danger">删除</button></form>
</td>
</tr>
{% else %}
<tr><td colspan="3" class="empty">还没有模型组。在上方输入统一模型名创建。</td></tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
